<head>

  <meta property="og:title" content="דילים שווים נכנסים ראשונים!">
  <meta property="og:description" content="מצטרפים לקבוצת וואטסאפ סגורה ומקבלים דילים לפני כולם.">
  <meta property="og:image" content="/whatsapp-deals-flyer.jpg">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020806;
      color: #fff;
    }

    body {
      display: grid;
      place-items: start center;
      font-family: Arial, sans-serif;
    }

    .flyer {
      position: relative;
      width: min(100vw, 605px);
      aspect-ratio: 605 / 1280;
      overflow: hidden;
      background: #020806;
    }

    .flyer img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .screen-hitbox {
      position: absolute;
      inset: 0;
      display: block;
      font-size: 0;
    }

    .screen-hitbox:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .9);
      outline-offset: -6px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="flyer" aria-label="דילים שווים נכנסים ראשונים">
    <img src="whatsapp-deals-flyer.jpg" alt="דילים שווים נכנסים ראשונים. מצטרפים לקבוצת וואטסאפ סגורה ומקבלים דילים, הנחות וקופונים לפני כולם.">
    <a class="screen-hitbox" href="https://chat.whatsapp.com/E8p0CU6boznAilbUd1pIdK" aria-label="מצטרפים עכשיו לקבוצת הוואטסאפ">
      <span class="sr-only">מצטרפים עכשיו לקבוצה</span>
    </a>
  </main>
</body>
</html>
